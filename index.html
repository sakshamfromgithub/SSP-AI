<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSP AI</title>

    <style>
        :root {
            --glass: #111;
            --border: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --accent: #c90000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        /* Background */
        .bg {
            position: fixed;
            inset: 0;

            background: #111;

            z-index: -1;
        }

        /* Layout */
        .app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            background: var(--glass);
            border-bottom: 1px solid var(--border);
        }

        /* Chat */
        .chat {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 700px;
            padding: 12px 14px;
            border-radius: 12px;
            line-height: 1.4;
        }

        .user {
            align-self: flex-end;
            background: #1e1e1e;
        }

        .ai {
            align-self: flex-start;
            background: #2a2a2a;
        }

        /* Input */
        .inputArea {
            padding: 12px;
            background: var(--glass);
            border-top: 1px solid var(--border);
        }

        .inputBox {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 10px;
            background: #111;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: #fff;
            padding: 10px;
        }

        button {
            padding: 10px 16px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        @media(max-width:600px) {
            .msg {
                max-width: 90%
            }
        }
    </style>
</head>

<body>

    <div class="bg"></div>

    <div class="app">

        <div class="header">SSP AI</div>

        <div class="chat" id="chat"></div>

        <div class="inputArea">
            <div class="inputBox">
                <textarea id="q" rows="1" placeholder="Type your doubt..."></textarea>
                <button id="askBtn">Send</button>
            </div>
        </div>

    </div>

    <script>
        const chat = document.getElementById("chat");
        const askBtn = document.getElementById("askBtn");
        const qEl = document.getElementById("q");

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "msg " + type;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement("div");
            div.className = "msg ai";
            div.id = "typing";
            div.innerText = "Typing...";
            chat.appendChild(div);
        }

        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }

        async function ask() {
            const message = qEl.value.trim();
            if (!message) return;

            addMessage(message, "user");
            qEl.value = "";

            addTyping();

            try {
                const res = await fetch("/.netlify/functions/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                let data = {};
                try { data = await res.json(); } catch (e) { }

                removeTyping();

                const reply = data.reply || "Reply nahi aaya";
                addMessage(reply, "ai");

            } catch (e) {
                removeTyping();
                addMessage("Network issue 😅", "ai");
            }
        }

        askBtn.addEventListener("click", ask);

        qEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                ask();
            }
        });

        /* initial msg */
        addMessage("Hi, main SSP AI hoon. Doubt pucho.", "ai");
    </script>

</body>

</html>
