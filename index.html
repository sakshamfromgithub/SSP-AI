<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4d1616">
<title>SSP AI — Saksham Study Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a1a;--muted:#6f6767;--line:#e7e2e0;--bg:#fbfaf9;--card:#fff;--brand:#4d1616;--brand-2:#651f1f;--tint:#f4ecec;--err:#a32b2b;--side:272px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:flex;height:100dvh;overflow:hidden}
.side{width:var(--side);flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:30;transition:transform .2s}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 16px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.brand b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-size:13px}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--err);border-color:#e6c4c4}
.btn:disabled{opacity:.45;cursor:not-allowed}
.new{width:100%;padding:10px;font-weight:500}
.search{margin:14px 0 6px}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:var(--bg)}
.list{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.group{font-size:12px;color:var(--muted);padding:12px 8px 4px}
.item{display:flex;align-items:center;border-radius:8px}
.item:hover,.item.on{background:var(--tint)}
.item .open{flex:1;min-width:0;text-align:left;border:0;background:none;padding:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on .open{color:var(--brand);font-weight:500}
.item .more{border:0;background:none;width:30px;height:30px;color:var(--muted);border-radius:6px;opacity:0}
.item:hover .more,.item .more:focus-visible{opacity:1}
.empty{color:var(--muted);font-size:13px;padding:20px 8px}
.foot{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;gap:2px}
.foot button{border:0;background:none;text-align:left;padding:8px;border-radius:8px;font-size:13px;color:#4a4343}
.foot button:hover{background:var(--tint);color:var(--brand)}
.foot p{margin:6px 8px 0;font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.menu{display:none}
.ttl{min-width:0;flex:1}
.ttl b,.ttl small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b{font-weight:600;font-size:14px}
.ttl small{font-size:12px;color:var(--muted)}
.scroll{flex:1;min-height:0;overflow-y:auto}
.col{max-width:760px;margin:0 auto;padding:28px 20px 12px}
.hello{padding:7vh 0 0}
.hello h1{font-size:clamp(26px,4vw,34px);line-height:1.2;letter-spacing:-.02em;font-weight:600;margin:0 0 8px}
.hello p{color:var(--muted);margin:0;max-width:52ch}
.resume{margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.try{margin-top:26px;border-top:1px solid var(--line)}
.try button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;font-size:15px}
.try button:hover{color:var(--brand)}
.try span{display:block;color:var(--muted);font-size:13px}
.msg{margin:0 0 22px;display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.bub{background:var(--tint);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.av{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:2px}
.ai-body{min-width:0;flex:1;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .7em}
.md ul,.md ol{margin:0 0 .7em;padding-left:1.3em}
.md li{margin:.2em 0}
.md h4{margin:1em 0 .4em;font-size:15px;font-weight:600}
.md code{background:var(--tint);padding:1px 5px;border-radius:5px;font-size:.92em}
.acts{margin-top:6px}
.acts button{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0}
.acts button:hover{color:var(--brand)}
.dots{display:flex;gap:5px;padding:10px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,70%,100%{opacity:.35;transform:none}35%{opacity:1;transform:translateY(-4px)}}
.err{color:var(--err);font-size:14px}
.dock{padding:8px 20px 14px}
.box{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px}
.box:focus-within{border-color:var(--brand)}
.box textarea{display:block;width:100%;border:0;outline:0;resize:none;background:none;min-height:28px;max-height:160px;padding:4px 6px;line-height:1.55}
.box textarea::placeholder{color:#9a9191}
.row{display:flex;align-items:center;gap:6px;margin-top:6px}
.row select{border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px;padding:5px 6px;max-width:110px}
.sp{flex:1}
.send{width:36px;height:36px;border:0;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}
.send:hover{background:var(--brand-2)}
.send:disabled{opacity:.4;cursor:not-allowed}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
dialog{border:0;border-radius:14px;padding:20px;width:min(440px,calc(100% - 32px));box-shadow:0 18px 60px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(25,12,12,.4)}
dialog h2{margin:0 0 6px;font-size:17px;font-weight:600}
dialog p{margin:0 0 14px;color:var(--muted);font-size:14px}
dialog textarea,dialog input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);background:#2a2121;color:#fff;font-size:13px;padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.shade{display:none}
@media(max-width:780px){
.side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}
.side.open{transform:none;box-shadow:10px 0 40px rgba(0,0,0,.15)}
.shade.on{display:block;position:fixed;inset:0;background:rgba(25,12,12,.3);z-index:20}
.menu{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px}
.top{padding:0 12px}.col{padding:20px 14px 8px}.dock{padding:6px 10px 10px}
.row select{max-width:92px}
.hide-sm{display:none}
}
@media(hover:none){.item .more{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="mark">SSP</div><div><b>Saksham Study Point</b><small>SSP AI</small></div></div>
    <button class="btn primary new" id="newBtn">New chat</button>
    <div class="search"><input id="q" type="search" placeholder="Search chats" aria-label="Search chats"></div>
    <div class="list" id="list"></div>
    <div class="foot">
      <button id="memBtn">Memory</button>
      <button id="clearBtn">Clear all chats</button>
      <p>Chats save in this browser, on this device.</p>
    </div>
  </aside>
  <div class="shade" id="shade"></div>
  <main class="main">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Open chats">☰</button>
      <div class="ttl"><b id="title">New chat</b><small id="mem"></small></div>
      <button class="btn hide-sm" id="renBtn">Rename</button>
      <button class="btn" id="memTop">Memory</button>
    </header>
    <div class="scroll" id="scroll" role="log" aria-live="polite"><div class="col" id="col"></div></div>
    <div class="dock">
      <div class="box">
        <textarea id="inp" rows="1" placeholder="Apna doubt likho…" aria-label="Your question"></textarea>
        <div class="row">
          <select id="selGrade" aria-label="Class"></select>
          <select id="selSub" aria-label="Subject"></select>
          <select id="selLang" aria-label="Reply language"></select>
          <span class="sp"></span>
          <button class="send" id="sendBtn" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="note">SSP AI galti kar sakta hai. Zaroori baatein check kar lena.</div>
    </div>
  </main>
</div>
<dialog id="dlg"><h2 id="dTitle"></h2><p id="dDesc"></p><div id="dBody"></div><div class="dact" id="dActs"></div></dialog>
<div class="toast" id="toast"></div>
<script>
(()=>{
"use strict";
const K={chats:"ssp_ai_conversations_v2",mem:"ssp_ai_memory_v1",prefs:"ssp_ai_prefs_v1"};
const $=id=>document.getElementById(id);
const read=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
let chats=read(K.chats,[]);if(!Array.isArray(chats))chats=[];
let notes=localStorage.getItem(K.mem)||"";
let prefs=Object.assign({grade:"",subject:"",language:"hinglish",useEarlier:true},read(K.prefs,{}));
const sorted=()=>[...chats].sort((a,b)=>b.updatedAt-a.updatedAt);
let activeId=sorted().find(c=>c.messages&&c.messages.length)?.id||null,busy=false;
const active=()=>chats.find(c=>c.id===activeId)||null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const mkTitle=t=>{t=t.replace(/\s+/g," ").trim();return t.length>40?t.slice(0,40)+"…":t||"New chat"};
function save(){try{chats=chats.slice(0,100);localStorage.setItem(K.chats,JSON.stringify(chats));localStorage.setItem(K.mem,notes);localStorage.setItem(K.prefs,JSON.stringify(prefs))}catch{toast("Storage is full. Delete some old chats.")}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2000)}
function md(src){
  const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const inl=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  const out=[];let list=null;const end=()=>{if(list){out.push("</"+list+">");list=null}};
  String(src).split("\n").forEach(line=>{
    let m;
    if(m=line.match(/^\s*[-*•]\s+(.*)/)){if(list!=="ul"){end();out.push("<ul>");list="ul"}out.push("<li>"+inl(m[1])+"</li>")}
    else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){end();out.push("<ol>");list="ol"}out.push("<li>"+inl(m[1])+"</li>")}
    else if(m=line.match(/^#{1,4}\s+(.*)/)){end();out.push("<h4>"+inl(m[1])+"</h4>")}
    else if(!line.trim())end();
    else{end();out.push("<p>"+inl(line)+"</p>")}
  });
  end();return out.join("");
}
const dayLabel=t=>{const d=Math.round((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);return d<1?"Today":d<2?"Yesterday":"Earlier"};
function renderList(){
  const q=$("q").value.trim().toLowerCase(),el=$("list");el.innerHTML="";
  const rows=sorted().filter(c=>c.messages.length&&(!q||c.title.toLowerCase().includes(q)||c.messages.some(m=>m.text.toLowerCase().includes(q))));
  if(!rows.length){el.innerHTML='<div class="empty">'+(q?"No matching chats.":"Your chats will show up here.")+"</div>";return}
  let g="";
  rows.forEach(c=>{
    const lab=dayLabel(c.updatedAt);
    if(lab!==g){g=lab;const h=document.createElement("div");h.className="group";h.textContent=g;el.append(h)}
    const it=document.createElement("div");it.className="item"+(c.id===activeId?" on":"");
    const o=document.createElement("button");o.className="open";o.textContent=c.title;o.title=c.title;
    o.onclick=()=>{activeId=c.id;renderAll();closeSide()};
    const m=document.createElement("button");m.className="more";m.textContent="⋯";m.setAttribute("aria-label","Chat options");m.onclick=()=>chatOptions(c.id);
    it.append(o,m);el.append(it);
  });
}
const TRY=[["Concept","Newton ke teeno laws simple words mein samjhao"],["Maths","x² − 5x + 6 = 0 ko step by step solve karo"],["Exam","Class 10 board exam ke liye 7 din ka revision plan banao"],["Practice","Photosynthesis par 5 practice questions do"]];
function welcome(){
  const w=document.createElement("div");w.className="hello";
  w.innerHTML="<h1>Aaj kya samajhna hai?</h1><p>Doubt likho. Main step by step, simple words mein samjhaunga, aur pichli baatein yaad rakhunga.</p>";
  const last=sorted().find(c=>c.messages.length);
  if(last){const r=document.createElement("div");r.className="resume";r.append("Pichli chat: "+last.title);const b=document.createElement("button");b.className="btn";b.textContent="Continue";b.onclick=()=>{activeId=last.id;renderAll()};r.append(b);w.append(r)}
  const t=document.createElement("div");t.className="try";
  TRY.forEach(([l,p])=>{const b=document.createElement("button");const s=document.createElement("span");s.textContent=l;b.append(s,p);b.onclick=()=>{$("inp").value=p;fit();$("inp").focus()};t.append(b)});
  w.append(t);$("col").append(w);
}
function row(m){
  const r=document.createElement("article");r.className="msg "+m.role;
  if(m.role==="user"){const b=document.createElement("div");b.className="bub";b.textContent=m.text;r.append(b);return r}
  const t=document.createElement("div");t.className="md";t.innerHTML=md(m.text);
  const cp=document.createElement("button");cp.textContent="Copy";
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(m.text);toast("Copied")}catch{toast("Could not copy")}};
  const acts=document.createElement("div");acts.className="acts";acts.append(cp);
  return ai([t,acts],r);
}
function ai(parts,r){
  r=r||Object.assign(document.createElement("article"),{className:"msg ai"});
  const a=document.createElement("div");a.className="av";a.textContent="SSP";
  const b=document.createElement("div");b.className="ai-body";b.append(...parts);r.append(a,b);return r;
}
function typing(){const d=document.createElement("div");d.className="dots";d.innerHTML="<i></i><i></i><i></i>";return ai([d])}
function errRow(msg,retry){
  const p=document.createElement("div");p.className="err";p.textContent=msg;
  const b=document.createElement("button");b.className="btn";b.textContent="Try again";b.style.marginTop="8px";b.onclick=retry;
  return ai([p,b]);
}
function renderChat(extra){
  const col=$("col");col.innerHTML="";const c=active();
  if(!c||!c.messages.length){welcome();return}
  c.messages.forEach(m=>col.append(row(m)));
  if(extra)col.append(extra);
  $("scroll").scrollTop=$("scroll").scrollHeight;
}
function memStatus(){
  const n=chats.filter(c=>c.id!==activeId&&c.messages.length).length,p=["this chat"];
  if(prefs.useEarlier&&n)p.push(n+" earlier chat"+(n>1?"s":""));
  if(notes.trim())p.push("your notes");
  $("mem").textContent="Remembers "+p.join(", ");
}
function renderAll(){
  const c=active();$("title").textContent=c?c.title:"New chat";$("renBtn").disabled=!c;
  renderList();renderChat();memStatus();
}
function earlierContext(){
  if(!prefs.useEarlier)return"";
  return sorted().filter(c=>c.id!==activeId&&c.messages.length).slice(0,6)
    .flatMap(c=>c.messages.slice(-4).map(m=>({t:m.timestamp||c.updatedAt,s:(m.role==="user"?"Student":"SSP AI")+" ("+c.title+"): "+m.text.slice(0,500)})))
    .sort((a,b)=>b.t-a.t).slice(0,14).reverse().map(x=>x.s).join("\n");
}
async function send(text,retry){
  if(busy)return;
  let c=active();
  if(!c){c={id:uid(),title:"New chat",createdAt:Date.now(),updatedAt:Date.now(),messages:[]};chats.unshift(c);activeId=c.id}
  if(!retry){
    c.messages.push({role:"user",text,timestamp:Date.now()});
    c.messages=c.messages.slice(-80);c.updatedAt=Date.now();
    if(c.title==="New chat")c.title=mkTitle(text);
    save();
  }
  $("title").textContent=c.title;busy=true;$("sendBtn").disabled=true;
  renderList();renderChat(typing());memStatus();
  const history=c.messages.slice(0,-1).slice(-16).map(m=>({role:m.role==="ai"?"model":"user",text:m.text}));
  try{
    const res=await fetch("/.netlify/functions/ask",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,history,crossChatContext:earlierContext(),memory:notes,language:prefs.language,grade:prefs.grade,subject:prefs.subject})});
    let data={};try{data=await res.json()}catch{}
    if(!res.ok||!data.reply)throw new Error(data.reply||"Server se jawab nahi aaya ("+res.status+").");
    c.messages.push({role:"ai",text:data.reply,timestamp:Date.now()});c.updatedAt=Date.now();save();renderAll();
  }catch(e){
    renderChat(errRow(e instanceof TypeError?"Network problem. Internet check karke dobara try karo.":e.message,()=>send(text,true)));
  }finally{busy=false;$("sendBtn").disabled=false;$("inp").focus()}
}
const fit=()=>{const i=$("inp");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,160)+"px"};
function submit(){const t=$("inp").value.trim();if(!t||busy)return;$("inp").value="";fit();send(t)}
const dlg=$("dlg");
function openDlg({title,desc,field,value,extra,actions}){
  $("dTitle").textContent=title;$("dDesc").textContent=desc||"";
  const b=$("dBody");b.innerHTML="";let f=null;
  if(field){f=document.createElement(field==="area"?"textarea":"input");if(field==="area"){f.rows=7;f.maxLength=2000}else{f.type="text";f.maxLength=70}f.value=value||"";b.append(f)}
  if(extra)b.append(extra);
  const a=$("dActs");a.innerHTML="";
  [{label:"Cancel",fn:()=>true},...actions].forEach(x=>{
    const k=document.createElement("button");k.type="button";k.className="btn "+(x.kind||"");k.textContent=x.label;
    k.onclick=()=>{if(x.fn(f&&f.value)!==false)dlg.close()};a.append(k);
  });
  dlg.showModal();if(f)f.focus();return f;
}
function chatOptions(id){
  const c=chats.find(x=>x.id===id);if(!c)return;
  openDlg({title:"Rename chat",field:"input",value:c.title,actions:[
    {label:"Delete chat",kind:"danger",fn:()=>{chats=chats.filter(x=>x.id!==id);if(activeId===id)activeId=sorted()[0]?.id||null;save();renderAll();toast("Chat deleted")}},
    {label:"Save",kind:"primary",fn:v=>{v=v.trim();if(!v){toast("Name cannot be empty");return false}c.title=v.slice(0,70);save();renderAll()}}]});
}
function memory(){
  const l=document.createElement("label");l.className="chk";
  const cb=document.createElement("input");cb.type="checkbox";cb.checked=prefs.useEarlier;
  l.append(cb,"Use my earlier chats as context");
  const f=openDlg({title:"Memory",desc:"Write what SSP AI should always remember, like your class, weak topics or how you like explanations. It is saved in this browser.",field:"area",value:notes,extra:l,
    actions:[{label:"Save",kind:"primary",fn:v=>{notes=v.trim().slice(0,2000);prefs.useEarlier=cb.checked;save();memStatus();toast("Memory saved")}}]});
  f.placeholder="Example: Main class 10 CBSE mein hoon. Fractions weak hain. Short steps pasand hain.";
}
const closeSide=()=>{$("side").classList.remove("open");$("shade").classList.remove("on")};
const sel=(id,key,first,items)=>{
  const s=$(id);s.innerHTML=(first?'<option value="">'+first+"</option>":"")+items.map(v=>Array.isArray(v)?'<option value="'+v[0]+'">'+v[1]+"</option>":"<option>"+v+"</option>").join("");
  s.value=prefs[key];s.onchange=()=>{prefs[key]=s.value;save()};
};
sel("selGrade","grade","Class",["Class 6","Class 7","Class 8","Class 9","Class 10","Class 11","Class 12","College"]);
sel("selSub","subject","Subject",["Maths","Science","Physics","Chemistry","Biology","English","Hindi","Social Science","Computer"]);
sel("selLang","language","",[["hinglish","Hinglish"],["hindi","Hindi"],["english","English"]]);
$("sendBtn").onclick=submit;
$("inp").addEventListener("input",fit);
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&!matchMedia("(hover:none)").matches){e.preventDefault();submit()}});
$("newBtn").onclick=()=>{activeId=null;renderAll();closeSide();$("inp").focus()};
$("q").addEventListener("input",renderList);
$("renBtn").onclick=()=>active()&&chatOptions(activeId);
$("memBtn").onclick=$("memTop").onclick=memory;
$("clearBtn").onclick=()=>openDlg({title:"Clear all chats?",desc:"All chats saved in this browser will be deleted. Your memory notes stay.",actions:[{label:"Clear all",kind:"danger",fn:()=>{chats=[];activeId=null;save();renderAll();toast("All chats cleared")}}]});
$("menuBtn").onclick=()=>{$("side").classList.add("open");$("shade").classList.add("on")};
$("shade").onclick=closeSide;
renderAll();
})();
</script>
</body>
